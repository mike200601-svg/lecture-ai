[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-ai"
version = "1.0.0"
description = "课堂录音 → 本地转录 → 课堂笔记。Lecture recordings to reliable Markdown notes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mike200601-svg" }]
keywords = ["whisper", "asr", "lecture-notes", "obsidian", "transcription", "faster-whisper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    # 核心逻辑三平台都跑 CI；手机同步辅助脚本是 Windows 专用。
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.urls]
# 建仓库时若用了别的名字，记得改这两行。
Homepage = "https://github.com/mike200601-svg/lecture-ai"
Repository = "https://github.com/mike200601-svg/lecture-ai"

[project.optional-dependencies]
# 本地 ASR。单独成组，未安装时其余功能与测试仍可运行。
asr = [
    "faster-whisper>=1.1.0",
]
# ffmpeg 静态二进制兜底（无管理员权限时可用）
ffmpeg = [
    "imageio-ffmpeg>=0.5",
]
cloud = [
    "openai>=1.68",
]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[project.scripts]
lecture-ai = "lecture_ai.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lecture_ai = ["database/*.sql", "web/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: 需要真实模型/长音频，默认跳过（用 -m slow 运行）",
]
filterwarnings = ["ignore::DeprecationWarning"]
