# 复制为 config/config.yaml 后按需修改（config.yaml 已被 .gitignore 忽略）。
#   Windows PowerShell:  Copy-Item config/config.example.yaml config/config.yaml
#   macOS / Linux:       cp config/config.example.yaml config/config.yaml
# 文件缺失时程序不会崩溃，会全部走默认值。
# 课堂自动笔记系统 —— 主配置
# 规则：
#   1. 任何 API key 都不许写在这里，只能放 .env（写了会被 config 加载器直接拒绝）
#   2. 路径可用相对路径（相对项目根目录）或绝对路径
#   3. ${ENV_VAR} 会被环境变量替换

paths:
  incoming_audio: data/incoming/audio
  incoming_images: data/incoming/images     # Phase 3 才会用
  web_exchange: data/web_exchange           # 与手机双向同步：GPT 批处理包往返
  # 日常 GPT 网页投喂包的存放目录。每节课一个子目录，目录名和包内文件名都带
  # 日期、时间和课程名。命令跑完会把完整路径打印出来。
  #   · 下面这个是相对路径，相对项目根目录，即 <项目目录>/exports/gpt_web
  #   · 想放别处就写绝对路径，注意加引号，例如：
  #       export_dir: "C:/Users/你的用户名/Desktop/GPT网页版待处理"
  # 若你把某个目录设成了 Obsidian Vault，务必把本目录放在 Vault 之外：
  # 投喂包里的转录/提示词/包说明都是 .md，会被 Obsidian 当成笔记，淹没真正的成稿。
  export_dir: exports/gpt_web
  session_dir: data/sessions
  processed_dir: data/processed
  cache_dir: data/cache
  log_dir: logs
  database: data/lecture_ai.db
  obsidian_vault: ""                        # 可选，例如 D:/Obsidian/MyVault；留空表示不启用

# ---------------------------------------------------------------- 转录
transcription:
  provider: local_whisper                   # local_whisper | openai | fake

  local_whisper:
    # 默认按「无 CUDA 的笔记本」配置：CPU + int8。
    # 这里填 HuggingFace 模型名，首次转录会自动下载到 data/cache/models，开箱可用。
    # 想离线跑 / 预先下载：把权重放进 models/faster-whisper-medium/，
    #   再把下面改成 model: models/faster-whisper-medium（相对项目根，见 README「模型准备」）。
    # 有 NVIDIA 显卡时改为：model: large-v3 / device: cuda / compute_type: float16
    model: medium
    device: cpu                             # cpu | cuda | auto
    compute_type: int8                      # int8 | int8_float16 | float16 | float32
    cpu_threads: 0                          # 0 = 自动（取物理核心数）
    beam_size: 5
    vad_filter: true                        # 过滤长静音，显著提速
    language: zh                            # null = 自动检测；中文课堂建议锁定 zh
    use_hotwords: false                     # 实录 A/B：长词表会在弱语音处诱发术语串入；术语留给 Phase 2 纠错
    condition_on_previous_text: false       # 防长音频复读
    repetition_penalty: 1.1                 # 轻度惩罚重复 token（真实课堂 A/B 验证）
    no_repeat_ngram_size: 3                 # 禁止 3-gram 无限循环

  openai:
    model: whisper-1
    # api_key 只从环境变量 OPENAI_API_KEY 读取

# ---------------------------------------------------------------- 音频
audio:
  ffmpeg_path: ""                           # 留空则自动探测 PATH，再退回 imageio-ffmpeg
  ffprobe_path: ""
  target_sample_rate: 16000
  target_channels: 1
  normalize: false                          # ffmpeg loudnorm，慢，默认关闭
  extensions: [".mp3", ".m4a", ".wav", ".flac", ".aac", ".ogg", ".opus"]
  chunking:
    enabled: false                          # 默认不切片，faster-whisper 自身可流式处理
    chunk_minutes: 30
    overlap_seconds: 5
    auto_threshold_minutes: 180             # 超过该时长自动启用切片

# ---------------------------------------------------------------- 处理流程
processing:
  auto_process: true                        # watch 发现文件后是否立即处理
  auto_advance_phase2: true                 # 仅在人工进入 High Integrity Mode 后推进；日常路线不会启动 Phase 2
  poll_interval: 15                         # watch 轮询间隔（秒）
  stable_checks: 2                          # 连续几次采样大小/时间不变才算写入完成
  quiet_seconds: 10                         # 距最后修改至少多少秒
  keep_incoming: true                       # Syncthing 接收目录必须保留源文件，避免移动后被重复下载
  min_audio_seconds: 60                     # 短于此时长的音频不建 session（防误触录音）

# ---------------------------------------------------------------- Phase 1.5 选择性重转录
repair:
  padding_seconds: 15                       # 可疑片段两侧扩窗（建议 10–20 秒）
  min_text_bytes: 60
  compression_ratio_threshold: 2.6
  unique_char_ratio_threshold: 0.16
  repeated_ngram_ratio_threshold: 0.55
  longest_run_threshold: 6
  sparse_segment_min_seconds: 45            # 超长片段却几乎无文字：疑似 VAD/ASR 漏识
  sparse_segment_max_chars_per_second: 0.60
  prompt_echo_min_terms: 5                  # 连续命中大量词表词且文本大部被其覆盖：疑似 prompt 串入
  prompt_echo_min_coverage: 0.55
  min_improvement_ratio: 0.20              # 新窗口异常分数至少下降 20%
  min_length_ratio: 0.05                   # 防止用近空结果替换有声内容

# ---------------------------------------------------------------- Phase 2A 忠实清洗
clean:
  chunk_minutes: 8                          # 允许范围 5–10 分钟
  overlap_seconds: 30
  max_retries: 2
  retry_base_seconds: 1.0
  min_retention_ratio: 0.45                 # 防止清洗偷偷变成摘要
  max_expansion_ratio: 1.35                 # 防止模型扩写/注入外部知识
  cross_segment_repetition_threshold: 6     # 连续完全相同短片段只保留首条，其余审计删除

# ---------------------------------------------------------------- 课程
course:
  match_tolerance_minutes: 30               # 录音起始时间与课表的容差
  default_course_key: unknown

# ---------------------------------------------------------------- Phase 2A 文本 LLM
llm:
  provider: chatgpt_web                    # chatgpt_web | openai | fake
  model: chatgpt-web-high                  # 网页端“高”模式；不伪装成 API 模型名
  max_tokens: 8000
  temperature: 0.2

# ---------------------------------------------------------------- API 路线成稿
# `lecture-ai note <session>`：把 REPAIRED 一次性交给 API 出成稿（A/B 选出的 B 路线）。
# 只发送文本，**永远不发送板书照片或课件**；有图的课请走 export-package + 网页会话。
# 需要 llm.provider = openai，并在 .env 里填 OPENAI_API_KEY。
note:
  max_output_tokens: 32000                  # 整篇笔记很长；沿用 llm.max_tokens(8000) 会被静默截断
  temperature: 0.3

vision:
  provider: anthropic
  model: claude-sonnet-5

obsidian:
  create_concepts: false                    # v1.0 刻意不创建概念页 / WikiLink / 图谱
  concept_threshold: 0.8

# ---------------------------------------------------------------- 隐私（硬闸门）
privacy:
  allow_cloud_audio: false                  # false 时禁止把音频发往云端 ASR
  allow_cloud_images: false
  allow_cloud_transcript: true

# ---------------------------------------------------------------- 日志
logging:
  level: INFO                               # DEBUG | INFO | WARNING | ERROR
  console_level: INFO
  max_bytes: 10485760                       # 10MB
  backup_count: 5
