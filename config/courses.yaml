# 课程与课表配置
#
# 用途：
#   1. 录音进来时，按录音起始时间自动匹配课程 → 决定 session_id 和 glossary
#   2. Phase 4 决定 Obsidian Vault 里的目录归属
#
# weekday: 1=周一 ... 7=周日
# 匹配容差由 config.yaml 的 course.match_tolerance_minutes 控制（默认 ±30 分钟）
# 匹配不上不会失败，只会落到 unknown 课程，事后可用 `lecture-ai assign` 归属。
#
# ↓↓↓ 下面是示例，请按实际课表修改 ↓↓↓

courses:
  quantum_mechanics:
    name: 量子力学
    teacher: ""
    semester: 2026-秋
    glossary: quantum_mechanics.txt
    obsidian_folder: University/量子力学        # Phase 4 用
    schedule:
      - weekday: 3
        start: "09:45"
        end: "11:25"
      - weekday: 3
        start: "14:00"
        end: "15:40"
      - weekday: 5
        start: "10:00"
        end: "11:40"

  electrodynamics:
    name: 电动力学
    teacher: ""
    semester: 2026-秋
    glossary: electrodynamics.txt
    obsidian_folder: University/电动力学
    schedule:
      - weekday: 2
        start: "08:00"
        end: "09:40"

  digital_electronics:
    name: 数字电子技术基础
    teacher: ""
    semester: 2026-秋
    glossary: digital_electronics.txt
    obsidian_folder: University/数字电子技术基础
    schedule:
      - weekday: 2
        start: "09:45"
        end: "11:20"

  # 兜底课程：匹配不到任何课表时使用，不要删除
  unknown:
    name: 未归类
    glossary: ""
    obsidian_folder: University/未归类
    schedule: []
