<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lecture-ai 面板</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa; --panel: #fff; --line: #e3e3e0; --text: #1c1c1a;
    --muted: #6b6b66; --accent: #2f6f4f; --warn: #8a5a1a; --err: #a33;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191918; --panel: #212120; --line: #34342f; --text: #e8e8e4;
      --muted: #9a9a92; --accent: #6fbf90; --warn: #d9a24a; --err: #e08585;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 16px; margin: 0 auto 0 0; font-weight: 650; }
  h1 small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  main { padding: 20px; display: grid; gap: 20px; grid-template-columns: minmax(0,3fr) minmax(0,2fr); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  section > h2 {
    font-size: 13px; margin: 0; padding: 10px 14px; color: var(--muted);
    border-bottom: 1px solid var(--line); font-weight: 600; letter-spacing: .02em;
  }
  .body { padding: 14px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  tbody tr[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  code, pre { font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; }
  pre {
    margin: 0; padding: 12px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; max-height: 420px; overflow: auto; white-space: pre-wrap;
    word-break: break-word; font-size: 12px;
  }
  button {
    font: inherit; padding: 6px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input[type=password], input[type=text] {
    font: inherit; padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); min-width: 200px;
  }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .pill.on { color: var(--accent); border-color: currentColor; }
  .pill.off { color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .muted { color: var(--muted); }
  .warn { color: var(--warn); }
  .err { color: var(--err); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0 0 14px; }
  dt { color: var(--muted); font-size: 12px; }
  dd { margin: 0; }
  #msg:empty { display: none; }
  #msg { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }

  /* ---- 流水线状态 ---- */
  #status { grid-column: 1 / -1; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .dot.live { background: var(--accent); }
  .dot.dead { background: var(--err); }
  .dot.idle { background: var(--muted); }
  .bar {
    height: 8px; border-radius: 999px; background: var(--bg);
    border: 1px solid var(--line); overflow: hidden; margin: 6px 0 2px;
  }
  .bar > i { display: block; height: 100%; background: var(--accent); transition: width .4s; }
  .job { padding: 10px 0; border-top: 1px solid var(--line); }
  .job:first-of-type { border-top: 0; padding-top: 0; }
  .job b { font-weight: 600; }
  #logtail {
    max-height: 190px; font-size: 11.5px; line-height: 1.5;
    color: var(--muted); margin-top: 10px;
  }
  details > summary { cursor: pointer; color: var(--muted); font-size: 12px; }

  /* ---- 健康告警：一切正常时整块不出现，出现即代表要人管 ---- */
  .alert {
    border: 1px solid; border-radius: 6px; padding: 9px 12px; margin-bottom: 8px;
    border-color: color-mix(in srgb, currentColor 45%, transparent);
    background: color-mix(in srgb, currentColor 9%, transparent);
  }
  .alert.error { color: var(--err); }
  .alert.warn { color: var(--warn); }
  .alert b { font-weight: 600; }
  .alert .hint {
    display: block; margin-top: 3px; color: var(--muted);
    font-size: 12px; line-height: 1.5;
  }
  .alert code {
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 4px; padding: 1px 5px; font-size: 11.5px;
  }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>lecture-ai <small id="runtime">加载中…</small></h1>
  <div class="row" id="keybox" hidden>
    <span id="keystate" class="pill off">令牌未设置</span>
    <input type="password" id="key" placeholder="OPENAI_API_KEY" autocomplete="off" spellcheck="false">
    <button id="savekey">存入内存</button>
  </div>
  <button id="reload">刷新</button>
</header>

<div id="msg"></div>

<main>
  <section id="status">
    <h2>流水线状态</h2>
    <div class="body" id="statusbody"><p class="muted">加载中…</p></div>
  </section>

  <section>
    <h2>课堂列表</h2>
    <table>
      <thead><tr><th>日期</th><th>课程</th><th>时长</th><th>REPAIRED</th><th>成稿</th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="muted">加载中…</td></tr></tbody>
    </table>
  </section>

  <section>
    <h2>详情</h2>
    <div class="body" id="detail"><p class="muted">在左侧选一节课。</p></div>
  </section>
</main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
let selected = null;
let runtime = {};
let logOpen = false;      // 日志折叠状态要跨自动刷新保留，否则每 5 秒被合上一次
let statusTimer = null;

//: 状态区自动刷新间隔。转录一节课要 45–65 分钟，进度本身每 30 秒音频才动一次，
//: 5 秒足够跟手，也不至于让面板一直打扰后台。
const STATUS_INTERVAL_MS = 5000;

function msg(text, cls) {
  const el = $("msg");
  el.textContent = text || "";
  el.className = cls || "";
}

async function api(path, options) {
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({ error: "响应不是合法 JSON" }));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

function minutes(sec) {
  return sec ? (sec / 60).toFixed(0) + " 分钟" : "—";
}

function tick(ok) {
  return ok ? '<span class="pill on">有</span>' : '<span class="pill off">无</span>';
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

function hms(sec) {
  if (!sec && sec !== 0) return "—";
  const s = Math.max(0, Math.round(sec));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? h + " 小时 " + m + " 分" : m + " 分钟";
}

function ago(sec) {
  if (sec == null) return "—";
  if (sec < 60) return Math.round(sec) + " 秒前";
  if (sec < 3600) return Math.round(sec / 60) + " 分钟前";
  return (sec / 3600).toFixed(1) + " 小时前";
}

// 正在转录的一节课：进度条 + 剩余时间估算
function jobHtml(j) {
  const p = j.progress;
  let inner = "<b>" + esc(j.course || j.session_id) + "</b> " +
              '<span class="muted">' + esc(j.session_id) + "</span>";
  if (!p) {
    // 状态是 TRANSCRIBING 但没有进度文件：多半是刚起步，或者 watch 中途被杀了
    return '<div class="job">' + inner +
           '<div class="muted">已进入转录，但还没有进度数据 —— 刚开始，或者上次转录被中断了。</div></div>';
  }
  const pct = p.percent == null ? 0 : p.percent;
  inner += '<div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>';
  inner += '<div class="muted">' + pct.toFixed(0) + "% · 已转 " + hms(p.done_sec) +
           " / 共 " + hms(p.total_sec) + " · 更新于 " + ago(p.age_sec);
  // 本机 CPU int8 实测约 0.44–0.67 倍速，取 0.55 估个数量级就够了
  if (p.percent != null && p.percent > 2 && p.percent < 100 && !p.stale) {
    const left = (p.total_sec - p.done_sec) * 0.55;
    inner += " · 约剩 " + hms(left);
  }
  inner += "</div>";
  if (p.stale) {
    inner += '<div class="err">进度已经 ' + ago(p.age_sec) +
             '没有更新，转录进程可能已经中断。用 <code>lecture-ai retry ' +
             esc(j.session_id) + "</code> 重跑。</div>";
  }
  return '<div class="job">' + inner + "</div>";
}

// 告警区。一切正常时返回空串 —— 这块不出现本身就是"没事"的信号。
function alertsHtml(health) {
  const list = (health && health.alerts) || [];
  return list.map((a) =>
    '<div class="alert ' + (a.level === "error" ? "error" : "warn") + '">' +
    "<b>" + esc(a.text) + "</b>" +
    (a.hint ? '<span class="hint">' + esc(a.hint).replace(/`([^`]+)`/g, "<code>$1</code>") + "</span>" : "") +
    "</div>"
  ).join("");
}

// 一行事实：开机多久、手机什么时候连上的、最近一个录音多新。
function factsHtml(health) {
  if (!health) return "";
  const bits = [];
  const m = health.machine || {};
  if (m.available && m.uptime_sec != null) {
    bits.push("开机 " + hms(m.uptime_sec) + (m.crash_count_30d ? " · 30 天内异常关机 " + m.crash_count_30d + " 次" : ""));
  }
  for (const d of (health.sync && health.sync.devices) || []) {
    bits.push(esc(d.name) + "：" + (d.connected ? "已连接" : "断开"));
  }
  const inc = health.incoming || {};
  if (inc.available && inc.latest_name) {
    bits.push("最近录音 " + ago(inc.age_hours * 3600));
  }
  if (!bits.length) return "";
  return '<div class="facts" style="margin-bottom:10px">' +
         bits.map((b) => "<span>" + b + "</span>").join("") + "</div>";
}

async function loadStatus() {
  const box = $("statusbody");
  let s;
  try {
    s = await api("/api/status");
  } catch (e) {
    box.innerHTML = '<p class="err">' + esc(e.message) + "</p>";
    return;
  }

  const w = s.watch || {};
  let html = alertsHtml(s.health) + factsHtml(s.health);
  html += '<div class="row" style="margin-bottom:10px">';
  if (w.running) {
    html += '<span><span class="dot live"></span>watch 运行中' +
            (w.pid ? '<span class="muted"> · PID ' + w.pid + "</span>" : "") +
            (w.heartbeat_age_sec != null
              ? '<span class="muted"> · 心跳 ' + ago(w.heartbeat_age_sec) + "</span>" : "") +
            "</span>";
  } else {
    html += '<span><span class="dot dead"></span><b>watch 没在运行</b>' +
            '<span class="muted"> · 新录音不会被自动处理</span></span>';
  }
  html += "</div>";

  // 启动命令已经在上面的告警里给过了，这里不重复，只补锁文件这一条附加信息
  if (!w.running && w.stale_lock) {
    html += '<p class="muted">锁文件是上次残留的，重启 watch 会自动接管。</p>';
  }

  if (s.transcribing && s.transcribing.length) {
    html += s.transcribing.map(jobHtml).join("");
  } else {
    html += '<div class="job"><span class="dot idle"></span>' +
            "当前没有正在转录的课。</div>";
  }

  if (s.waiting && s.waiting.length) {
    html += '<div class="job"><span class="muted">排队中（' + s.waiting.length + " 节）：</span> " +
            s.waiting.map((j) => esc(j.course || j.session_id)).join("、") + "</div>";
  }

  const lines = s.log_tail || [];
  html += "<details" + (logOpen ? " open" : "") + ' id="logbox"><summary>最近日志（' +
          lines.length + " 行）</summary><pre id=\"logtail\">" +
          (lines.length ? esc(lines.join("\n")) : "（日志为空）") + "</pre></details>";

  box.innerHTML = html;
  $("logbox").ontoggle = (e) => { logOpen = e.target.open; };
}

async function loadRuntime() {
  runtime = await api("/api/runtime");
  $("runtime").textContent = runtime.provider + " / " + runtime.model;
  $("keybox").hidden = !runtime.needs_api_key;
  const state = $("keystate");
  state.textContent = runtime.api_key_set ? "令牌已在内存中" : "令牌未设置";
  state.className = "pill " + (runtime.api_key_set ? "on" : "off");
}

async function loadSessions() {
  const { sessions } = await api("/api/sessions");
  const tbody = $("rows");
  if (!sessions.length) {
    tbody.innerHTML = '<tr><td colspan="5" class="muted">还没有 session。先把录音放进 data/incoming/audio 并运行 watch。</td></tr>';
    return;
  }
  tbody.innerHTML = "";
  for (const s of sessions) {
    const tr = document.createElement("tr");
    tr.dataset.id = s.session_id;
    if (s.error) {
      tr.innerHTML = '<td colspan="5" class="err">' + s.session_id + " — " + s.error + "</td>";
    } else {
      tr.innerHTML =
        "<td>" + (s.date || "—") + "</td>" +
        "<td>" + (s.course || "—") + "</td>" +
        "<td>" + minutes(s.duration_sec) + "</td>" +
        "<td>" + tick(s.has_repaired) + "</td>" +
        "<td>" + tick(s.has_note) + "</td>";
      tr.onclick = () => select(s.session_id);
    }
    tbody.appendChild(tr);
  }
  markSelected();
}

function markSelected() {
  for (const tr of $("rows").querySelectorAll("tr[data-id]")) {
    tr.setAttribute("aria-selected", String(tr.dataset.id === selected));
  }
}

async function select(id) {
  selected = id;
  markSelected();
  msg("");
  const box = $("detail");
  box.innerHTML = '<p class="muted">读取中…</p>';
  try {
    const d = await api("/api/sessions/" + encodeURIComponent(id));
    box.innerHTML =
      "<dl>" +
      "<dt>Session</dt><dd><code>" + d.session_id + "</code></dd>" +
      "<dt>课程</dt><dd>" + (d.course || "—") + "</dd>" +
      "<dt>状态</dt><dd>" + d.state + "</dd>" +
      "<dt>转录长度</dt><dd>" + (d.transcript_chars ? d.transcript_chars.toLocaleString() + " 字符" : "无 REPAIRED") + "</dd>" +
      "<dt>板书 / 课件</dt><dd>" + d.board_count + " / " + d.slide_count + "</dd>" +
      "<dt>成稿</dt><dd>" + (d.has_note ? "<code>" + d.note_name + "</code>" : "未生成") + "</dd>" +
      "</dl>" +
      '<div class="row">' +
      '<button class="primary" id="gen"' + (d.has_repaired ? "" : " disabled") + ">生成成稿（API）</button>" +
      '<button id="pkg"' + (d.has_repaired ? "" : " disabled") + ">生成投喂包</button>" +
      (d.has_note ? '<button id="view">查看成稿</button>' : "") +
      "</div>" +
      (d.board_count || d.slide_count
        ? '<p class="warn">这节课有板书或课件。API 路线不发送图片，成稿不会包含它们 —— 需要的话用投喂包走网页会话。</p>'
        : "") +
      '<div id="preview" style="margin-top:14px"></div>';

    $("gen").onclick = () => generate(d);
    $("pkg").onclick = () => makePackage(d);
    if (d.has_note) $("view").onclick = () => viewNote(d.session_id);
  } catch (e) {
    box.innerHTML = '<p class="err">' + e.message + "</p>";
  }
}

async function generate(d) {
  if (runtime.needs_api_key && !runtime.api_key_set) {
    msg("请先在右上角填入 API 令牌。它只存在服务端内存里，不会落盘。", "warn");
    return;
  }
  if (d.has_note && !confirm("成稿已存在，覆盖它？旧稿不会自动备份。")) return;
  const btn = $("gen");
  btn.disabled = true;
  btn.textContent = "生成中，可能要一两分钟…";
  msg("");
  try {
    const r = await api("/api/sessions/" + encodeURIComponent(d.session_id) + "/note", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ force: !!d.has_note }),
    });
    const u = r.usage || {};
    msg("成稿已生成：" + r.note_name + "（" + r.model + "，入 " +
        (u.input_tokens || 0) + " / 出 " + (u.output_tokens || 0) + " token）", "");
    await loadSessions();
    await select(d.session_id);
    viewNote(d.session_id);
  } catch (e) {
    msg(e.message, "err");
    btn.disabled = false;
    btn.textContent = "生成成稿（API）";
  }
}

async function makePackage(d) {
  const btn = $("pkg");
  btn.disabled = true;
  try {
    const r = await api("/api/sessions/" + encodeURIComponent(d.session_id) + "/export-package", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
    });
    msg("投喂包已生成：" + r.output_dir + "（板书 " + r.board_count + " / 课件 " + r.slide_count + "）", "");
  } catch (e) {
    msg(e.message, "err");
  }
  btn.disabled = false;
}

async function viewNote(id) {
  const box = $("preview");
  if (!box) return;
  box.innerHTML = '<p class="muted">读取中…</p>';
  try {
    const r = await api("/api/sessions/" + encodeURIComponent(id) + "/note");
    const pre = document.createElement("pre");
    pre.textContent = r.markdown;
    box.innerHTML = "";
    box.appendChild(pre);
  } catch (e) {
    box.innerHTML = '<p class="err">' + e.message + "</p>";
  }
}

$("savekey").onclick = async () => {
  const input = $("key");
  try {
    runtime = await api("/api/key", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ api_key: input.value }),
    });
    input.value = "";                 // 不在页面上留存令牌
    await loadRuntime();
    msg("令牌已存入服务端内存。进程退出即失效，不会写进任何文件。", "");
  } catch (e) {
    msg(e.message, "err");
  }
};

$("reload").onclick = async () => {
  msg("");
  await loadRuntime();
  await loadStatus();
  await loadSessions();
  if (selected) await select(selected);
};

// 页面被切到后台时停掉轮询：没人看的时候不该继续敲服务端。
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    clearInterval(statusTimer);
    statusTimer = null;
  } else if (!statusTimer) {
    loadStatus();
    statusTimer = setInterval(loadStatus, STATUS_INTERVAL_MS);
  }
});

(async () => {
  try {
    await loadRuntime();
    await loadStatus();
    await loadSessions();
    statusTimer = setInterval(loadStatus, STATUS_INTERVAL_MS);
  } catch (e) {
    msg(e.message, "err");
  }
})();
</script>
</body>
</html>
