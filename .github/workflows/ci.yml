name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上新的 push 取消旧的运行，省 CI 时间。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂了不该掩盖其他平台的结果。
      fail-fast: false
      matrix:
        # 三个平台各测一遍最新 Python（跨平台回归），
        # 再在 Linux 上补测下限与中间版本（版本兼容性），共 5 个 job。
        include:
          - { os: ubuntu-latest,  python: "3.11" }
          - { os: ubuntu-latest,  python: "3.12" }
          - { os: ubuntu-latest,  python: "3.13" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest,   python: "3.13" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # 只在 Linux 装系统 ffmpeg：它顺带提供 ffprobe，能覆盖
      # 「从 PATH 找到 ffmpeg + ffprobe」这条分支。Windows/macOS 上
      # 装系统 ffmpeg 太慢，改由 [ffmpeg] extra 的静态二进制覆盖
      # 「imageio 兜底、无 ffprobe」那条分支 —— 两条都测到了。
      - name: Install ffmpeg (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install package
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,asr,ffmpeg]"

      # 没有 config.yaml（它不进版本库）时程序必须走默认值而不是崩溃。
      # doctor 会因为 CI 上没有下载模型而报 FAIL 退出码，这里只验证它不崩。
      - name: Smoke check without config.yaml
        run: |
          python -m lecture_ai --version
          python -m lecture_ai --help
          python -m lecture_ai doctor || true

      - name: Run tests
        run: python -m pytest -q

  package:
    name: 构建与元数据检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install -U pip build twine
          python -m build
      - name: Validate metadata
        run: python -m twine check dist/*
      # 页面文件必须真的被打进 wheel，否则 `lecture-ai serve` 装完就是 500。
      - name: Assert WebUI page is packaged
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          target = "lecture_ai/web/static/index.html"
          if target not in names:
              sys.exit(f"{target} 不在 wheel 里：{names}")
          print(f"OK: {target} 已打包 ({wheel})")
          PY
